apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// ---------------------------------------------------------------------------
// Version: derived from package.json ("1.2.3" → versionName 1.2.3,
// versionCode 10203). Bump "version" in package.json for every Play upload.
// A CI build can override the code with -PversionCode=<n> or VERSION_CODE.
// ---------------------------------------------------------------------------
def packageJson = new JsonSlurper().parse(file('../../package.json'))
def appVersionName = packageJson.version as String
def versionParts = appVersionName.tokenize('.-')[0..2].collect { it as int }
def derivedVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
def appVersionCode = (project.findProperty('versionCode') ?: System.getenv('VERSION_CODE') ?: derivedVersionCode) as int

// ---------------------------------------------------------------------------
// Release signing. Credentials never live in Git. Provide them either in
// android/keystore.properties (git-ignored):
//     storeFile=/absolute/path/to/upload-keystore.jks
//     storePassword=…
//     keyAlias=upload
//     keyPassword=…
// or as environment variables (CI): ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD,
// ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
// Without them, release builds are produced unsigned (and must be signed
// before uploading to Google Play).
// ---------------------------------------------------------------------------
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String key, String env -> keystoreProperties.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_FILE')
def hasReleaseSigning = releaseStoreFile && file(releaseStoreFile).exists()

android {
    namespace = "com.saikumar.sqlbuilder"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.saikumar.sqlbuilder"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        // Capacitor's generated assets and plugins are outside this project
        checkDependencies false
    }
}

if (!hasReleaseSigning) {
    logger.lifecycle("Release signing not configured: release builds will be unsigned. See ANDROID.md → Release signing.")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
