name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Committed bundle and asset versions are up to date
        run: |
          npm run build
          git diff --exit-code -- dist/ index.html || (echo "::error::dist/ or index.html asset versions are stale. Run 'npm run build' and commit the result." && exit 1)
